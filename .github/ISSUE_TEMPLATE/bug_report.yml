name: Bug report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search [existing issues](https://github.com/Ayush7614/ayushbuilds.dev/issues) first.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: The mobile nav does not close after clicking a link...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The menu should close and scroll to the section.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open site on mobile (375px width)
        2. Tap hamburger menu
        3. Tap "Projects"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did you see this?
      options:
        - Production (ayushbuilds-dev.vercel.app)
        - Local development
        - Both
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / device (if UI-related)
      placeholder: Chrome 131 on iPhone 15, Safari macOS, etc.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop images or GIFs here.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report
          required: true
